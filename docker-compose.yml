services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_ctdrs}
      POSTGRES_USER: ${POSTGRES_USER:-ai_ctdrs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_ctdrs} -d ${POSTGRES_DB:-ai_ctdrs}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
